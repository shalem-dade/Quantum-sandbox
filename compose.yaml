services:
  quantum-sandbox:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/quantum-sandbox.sqlite3
      FRONTEND_DIST: /app/dist
    volumes:
      - quantum-data:/app/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 12s
volumes:
  quantum-data:
